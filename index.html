<!doctype html>
<!-- Interview Gym: BATCH-API version. Requires the NEW Worker (mode "evaluateInterview"). Do not publish until that Worker is deployed. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview Gym | By K.Seoudi</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#0b1f3a;--mu:#5a6b82;--bd:#dbe3ee;--tl:#0b7f86;--tl2:#e1f6f6;--on:#fff;--bad:#c0392b;--ok:#13795b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121f;--card:#10203a;--tx:#eaf1fb;--mu:#9fb0c7;--bd:#1f3556;--tl:#2cc7c7;--tl2:#0f3340;--on:#04212a;--bad:#ff8a7a;--ok:#4fd1a5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08121f;--card:#10203a;--tx:#eaf1fb;--mu:#9fb0c7;--bd:#1f3556;--tl:#2cc7c7;--tl2:#0f3340;--on:#04212a;--bad:#ff8a7a;--ok:#4fd1a5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px}.brand b{color:var(--tl)}
.lang{display:flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;color:var(--mu);padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--tl);color:var(--on);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.2;margin:8px 0}h2{font-size:21px;line-height:1.35;margin:14px 0}h3{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:14px}.tag{color:var(--tl);font-weight:600}
.btn{background:var(--tl);color:var(--on);border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn:disabled{opacity:.55;cursor:default}.btn.big{font-size:18px}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;text-decoration:underline}.lnk:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tl2);border-color:var(--tl);color:var(--tl);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--tl);transition:width .5s}
textarea{width:100%;min-height:170px;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--tx);resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--tl);outline-offset:2px}
.er{color:var(--bad);margin:6px 0}.fb{background:var(--tl2);border-radius:12px;padding:14px;margin:10px 0}
.steps{display:grid;gap:8px;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;display:flex;gap:10px;align-items:center}
.steps li:before{content:counter(s);background:var(--tl);color:var(--on);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.big-n{font-size:56px;font-weight:800;color:var(--tl);line-height:1}
.d{margin:10px 0}.d .row{font-size:14px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--tl2);color:var(--tl);font-weight:600}
.ex{border-inline-start:3px solid var(--tl);padding-inline-start:12px;margin:10px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--tl);border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-inline-end:6px}@keyframes r{to{transform:rotate(360deg)}}
.sig{font-size:12px;letter-spacing:.08em;color:var(--mu);margin-top:-2px;font-weight:500}
.progress-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat strong{display:block;font-size:24px;color:var(--tl)}.stat span{font-size:12px;color:var(--mu)}.history-item{padding:12px 0;border-top:1px solid var(--bd)}.history-item .bar{margin:5px 0}\n.ft{text-align:center;color:var(--mu);font-size:13px;padding:20px 0 8px;letter-spacing:.04em}.ft:before{content:"";display:block;width:36px;height:2px;background:var(--tl);margin:0 auto 12px;border-radius:2px}
@media(min-width:700px){#app{padding:32px 16px}h1{font-size:40px}.btn{width:auto}.btn.big{width:100%}}
 
/* Modern visual refresh — Staging branch only */
:root{
 --bg:#f3f6fb;--card:#ffffff;--tx:#10243d;--mu:#65758b;--bd:#e1e8f2;
 --tl:#087f8c;--tl2:#e5f5f5;--on:#ffffff;
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#0b1422;--card:#111f32;--tx:#edf4ff;--mu:#a5b4c8;--bd:#263950;--tl:#35c4c8;--tl2:#12343b;--on:#06232a}
}
:root[data-theme="dark"]{--bg:#0b1422;--card:#111f32;--tx:#edf4ff;--mu:#a5b4c8;--bd:#263950;--tl:#35c4c8;--tl2:#12343b;--on:#06232a}
body{
 background:radial-gradient(ellipse at 12% 0%,rgba(8,127,140,.09),transparent 34%),var(--bg);
 font-size:15px;line-height:1.65;letter-spacing:.005em;
}
#app{max-width:900px;padding:22px 18px 36px}
header{padding:8px 2px 18px;margin-bottom:18px;border-bottom:1px solid var(--bd);gap:14px}
.brand{font-size:23px;letter-spacing:-.7px;line-height:1.15}
.sig{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.card{
 border:1px solid var(--bd);border-radius:20px;padding:24px;margin-bottom:18px;
 box-shadow:0 8px 28px rgba(18,38,63,.045);animation:up .28s ease;
}
h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.25px;line-height:1.12;margin:10px 0 14px}
h2{font-size:clamp(20px,3vw,24px);letter-spacing:-.45px;margin:8px 0 16px}
h3{font-size:16px;letter-spacing:-.15px;margin:0 0 10px}
.mu{font-size:14px;line-height:1.7}
.tag{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.btn{
 border-radius:13px;padding:13px 22px;min-height:48px;
 box-shadow:0 5px 14px rgba(8,127,140,.14);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px rgba(8,127,140,.2);filter:brightness(1.03)}
.btn.big{min-height:54px}
.lnk{font-weight:600}
.chips{gap:10px}
.chip{border-radius:12px;padding:10px 15px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.chip:hover{border-color:var(--tl);transform:translateY(-1px)}
.lang{padding:3px;border-radius:14px}
.lang button{border-radius:11px;padding:7px 13px;font-weight:600}
textarea{border-radius:14px;padding:15px;line-height:1.7;min-height:180px}
textarea:focus{border-color:var(--tl);box-shadow:0 0 0 3px rgba(8,127,140,.12)}
.bar{height:10px;background:var(--bd);margin:9px 0 13px}
.bar i{border-radius:99px;background:linear-gradient(90deg,var(--tl),#27b4b0)}
.pill{padding:5px 11px;font-size:12px;letter-spacing:.02em}
.fb{border:1px solid var(--bd);border-radius:15px;padding:16px}
.steps{gap:12px}
.steps li{align-items:flex-start;line-height:1.5}
.steps li:before{width:28px;height:28px;box-shadow:0 3px 8px rgba(8,127,140,.18)}
.progress-grid{gap:12px}
.stat{border-radius:15px;padding:16px;min-height:88px}
.stat strong{font-size:28px;letter-spacing:-.8px}
.stat span{font-size:12px;line-height:1.4}
.history-item{padding:16px 0}
.history-item .bar{height:8px}
.big-n{font-size:clamp(48px,8vw,64px);letter-spacing:-2px}
.d{margin:14px 0 18px}
.ft{text-align:center;color:var(--mu);font-size:12px;padding:26px 0 10px;letter-spacing:.04em}
.ft:before{content:"";display:block;width:42px;height:3px;background:var(--tl);margin:0 auto 13px;border-radius:3px}
@media(min-width:700px){
 #app{padding:30px 20px 44px}
 header{margin-bottom:22px}
 .card{padding:28px}
 .progress-grid{gap:14px}
}
@media(max-width:520px){
 #app{padding:14px 12px 28px}
 header{align-items:flex-start;flex-wrap:wrap}
 .brand{font-size:21px}
 .card{padding:18px;border-radius:17px}
 .progress-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .progress-grid .stat:last-child:nth-child(odd){grid-column:1/-1}
 .row{align-items:flex-start}
 h1{font-size:32px}
 .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

/* Approved elegant navy + violet identity — Staging only */
:root{
 --bg:#f5f4fc;--card:#ffffff;--tx:#151b3b;--mu:#68708c;--bd:#e4e0f4;
 --tl:#7041c8;--tl2:#f0eaff;--on:#ffffff;
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#101329;--card:#191d3b;--tx:#f3f0ff;--mu:#b7b3d0;--bd:#343052;--tl:#b18aff;--tl2:#30264b;--on:#17132a}
}
:root[data-theme="dark"]{--bg:#101329;--card:#191d3b;--tx:#f3f0ff;--mu:#b7b3d0;--bd:#343052;--tl:#b18aff;--tl2:#30264b;--on:#17132a}
body{
 background:
  radial-gradient(ellipse at 88% 7%,rgba(139,92,246,.14),transparent 32%),
  radial-gradient(ellipse at 8% 32%,rgba(99,102,241,.08),transparent 30%),
  var(--bg);
 color:var(--tx);
}
#app{max-width:1080px}
header{padding:12px 4px 20px}
.brand{font-size:25px;letter-spacing:-.9px;color:var(--tx)}
.brand b{background:linear-gradient(100deg,#7543d1,#b46be8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{border-radius:999px;padding:4px;background:var(--card);box-shadow:0 4px 16px rgba(35,25,75,.06)}
.lang button{border-radius:999px;padding:8px 16px}
.lang button[aria-pressed=true]{
 background:linear-gradient(115deg,#7041c8,#9859df);color:#fff;
 box-shadow:0 3px 10px rgba(112,65,200,.22)
}
.lnk{color:var(--tl)}
.card{
 border-color:var(--bd);
 box-shadow:0 12px 34px rgba(42,31,89,.055);
}
#app > .card:first-of-type{
 position:relative;overflow:hidden;
 padding:clamp(28px,5vw,54px);
 background:linear-gradient(115deg,#fff 0%,#faf8ff 56%,#f0eaff 100%);
 border-color:#e2d9f7;
}
#app > .card:first-of-type:after{
 content:"";position:absolute;width:280px;height:280px;border-radius:50%;
 right:-100px;top:-145px;
 background:radial-gradient(circle,rgba(151,104,226,.18),rgba(151,104,226,0));
 pointer-events:none;
}
#app > .card:first-of-type .tag{color:#7543d1;letter-spacing:.13em}
#app > .card:first-of-type h1{max-width:760px;color:#171d3e}
#app > .card:first-of-type .mu{max-width:720px;color:#626b8b;font-size:15px}
.btn{
 background:linear-gradient(110deg,#7041c8,#8e4fd2);
 box-shadow:0 7px 18px rgba(112,65,200,.2);
}
.btn:hover:not(:disabled){box-shadow:0 10px 24px rgba(112,65,200,.28)}
.chip[aria-pressed=true]{background:var(--tl2);border-color:var(--tl);color:var(--tl)}
.bar i{background:linear-gradient(90deg,#7041c8,#b06de5)}
.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.steps li{
 position:relative;min-height:100px;padding:18px 14px 18px 52px;
 align-items:center;background:linear-gradient(145deg,var(--card),var(--bg));
 border:1px solid var(--bd);border-radius:16px;
 box-shadow:0 5px 16px rgba(42,31,89,.035)
}
.steps li:before{
 position:absolute;left:14px;top:50%;transform:translateY(-50%);
 background:linear-gradient(135deg,#7041c8,#a66be0);
 box-shadow:0 4px 10px rgba(112,65,200,.2)

:root[dir="rtl"] .steps li{padding:18px 52px 18px 14px}

@media(prefers-reduced-motion:reduce){

}


/* Hero illustration and unified feature icons — Staging only */
.hero{
 display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,1.05fr);
 align-items:center;gap:18px;min-height:390px;padding:clamp(24px,4vw,42px)!important;
 background:linear-gradient(115deg,#fff 0%,#fbf9ff 48%,#eee6ff 100%)!important;
}
.hero-copy{position:relative;z-index:1}
.hero-copy h1{max-width:570px}
.hero-copy .mu{max-width:520px;margin:14px 0 20px}
.hero-copy .btn.big{max-width:360px}
.hero-art{min-width:0;display:flex;align-items:center;justify-content:center}
.hero-art svg{display:block;width:100%;max-width:560px;height:auto;overflow:visible}
.how-card{padding:26px!important}
.how-card h3{font-size:19px;margin-bottom:20px}
.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0}
.steps li{
 min-height:128px;padding:22px 18px 22px 76px;position:relative;
 display:flex;align-items:center;gap:10px;
 background:linear-gradient(145deg,#fff,#f8f5ff);
 border:1px solid #e4dcf6;border-radius:18px;
 box-shadow:0 8px 22px rgba(64,43,120,.06);}
.steps li:before{display:none}
.step-icon{
 position:absolute;left:16px;top:50%;transform:translateY(-50%);
 width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
 background:linear-gradient(145deg,#f0e5ff,#dfd0ff);
 box-shadow:inset 0 1px 0 #fff,0 5px 12px rgba(100,64,170,.12)
}
.step-icon svg{width:31px;height:31px;fill:none;stroke:#7041c8;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
.step-copy{font-weight:600;line-height:1.45;padding-inline-end:22px}
.step-number{
 position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:50%;
 display:grid;place-items:center;color:white;font-size:13px;font-weight:800;
 background:linear-gradient(135deg,#a86be7,#7136c9);
 box-shadow:0 4px 10px rgba(112,65,200,.2)
}
:root[dir="rtl"] .steps li{padding:22px 76px 22px 18px}
:root[dir="rtl"] .step-icon{left:auto;right:16px}
:root[dir="rtl"] .step-number{right:auto;left:14px}
@media(max-width:760px){
 .hero{grid-template-columns:1fr;gap:4px;min-height:0}
 .hero-art{grid-row:1;max-width:440px;margin:0 auto -4px}
 .hero-copy{grid-row:2}
 .hero-copy .btn.big{max-width:none}
 .steps{grid-template-columns:1fr}
 .steps li{min-height:88px}
}
@media(max-width:520px){
 .hero{padding:20px!important}
 .hero-art{max-width:340px}
 .how-card{padding:19px!important}
 .steps li{min-height:82px}
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .hero{background:linear-gradient(115deg,#191d3b,#252047)!important}
 :root:not([data-theme="light"]) .steps li{background:linear-gradient(145deg,#191d3b,#211d3e);border-color:#393052}
}
:root[data-theme="dark"] .hero{background:linear-gradient(115deg,#191d3b,#252047)!important}
:root[data-theme="dark"] .steps li{background:linear-gradient(145deg,#191d3b,#211d3e);border-color:#393052}


/* Four-stage interview setup experience — Staging only */
.setup-page{max-width:1040px;margin:0 auto}
.setup-progress{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 22px;padding:12px 18px;max-width:760px;border:1px solid var(--bd);border-radius:18px;background:linear-gradient(110deg,rgba(255,255,255,.92),rgba(240,232,255,.9));box-shadow:0 6px 18px rgba(42,31,89,.045)}
.setup-progress-item{display:flex;align-items:center;gap:9px;color:var(--mu);font-size:13px;white-space:nowrap;flex:1;justify-content:center}
.setup-progress-item span{width:32px;height:32px;border:1px solid #cfc4e9;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--card);color:var(--mu)}
.setup-progress-item.active{color:var(--tl);font-weight:800}
.setup-progress-item.active span,.setup-progress-item.done span{background:linear-gradient(135deg,#a66be7,#7041c8);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(112,65,200,.2)}
.setup-progress>i{height:3px;width:clamp(20px,8vw,76px);flex:0 1 76px;border-radius:9px;background:linear-gradient(90deg,#cbb8ee,#e7def7)}
.setup-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 28px;margin-bottom:20px;border-radius:22px;background:linear-gradient(110deg,rgba(255,255,255,.9),rgba(240,232,255,.85));border:1px solid var(--bd)}
.setup-hero h1{margin:8px 0;font-size:clamp(28px,4vw,38px)}
.setup-hero .mu{max-width:600px;margin:0}
.setup-hero-art{flex:none;width:116px;height:116px;border-radius:30px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff,#e5d7ff 72%);box-shadow:inset 0 1px 0 #fff,0 12px 24px rgba(112,65,200,.1);color:#7945ce;font-size:68px}
.selection-panel{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(42,31,89,.045)}
.selection-heading{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.selection-heading h2,.custom-section h2{margin:0 0 4px;font-size:20px}
.selection-heading .mu{margin:0}
.selection-symbol{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--tl2);color:var(--tl);font-size:29px}
.level-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.level-option{display:flex;align-items:center;gap:14px;text-align:start;min-height:104px;padding:15px;border:1px solid var(--bd);border-radius:17px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:.16s ease}
.level-option:hover,.track-option:hover{border-color:var(--tl);transform:translateY(-2px)}
.level-option.selected,.track-option.selected{border:2px solid var(--tl);background:linear-gradient(120deg,var(--tl2),var(--card));box-shadow:0 6px 18px rgba(112,65,200,.1)}
.level-emoji{width:54px;height:54px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--tl2);font-size:30px}
.level-copy{display:grid;gap:4px;flex:1}
.level-copy b{font-size:17px}
.level-copy small,.track-option small{color:var(--mu);font-size:12px;line-height:1.45}
.select-mark{width:25px;height:25px;flex:none;border:1.5px solid #bdb2d8;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900}
.selected .select-mark{background:var(--tl);border-color:var(--tl)}
.track-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.track-option{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:7px;min-height:142px;height:100%;padding:18px;border:1px solid var(--bd);border-radius:17px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:border-color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease}
.track-option:last-child{grid-column:2;justify-self:stretch}
.track-option:nth-child(4),.track-option:nth-child(5){background-image:linear-gradient(145deg,rgba(166,107,231,.055),transparent 68%)}
.track-option:nth-child(4):hover,.track-option:nth-child(5):hover{box-shadow:0 9px 22px rgba(112,65,200,.12)}
.track-option .track-emoji{width:45px;height:45px;border-radius:14px;background:var(--tl2);display:grid;place-items:center;font-size:25px}
.track-option b{font-size:15px;line-height:1.3;padding-inline-end:20px}
.track-option small{display:block}
.track-option .select-mark{position:absolute;top:12px;right:12px;width:22px;height:22px}

let memoryDeviceId="";
function getDeviceId(){
  const key="interview_gym_device_id";
  try{
    let id=localStorage.getItem(key);
    if(id&&/^[A-Za-z0-9_-]{16,64}$/.test(id))return id;
    id=(crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,""):Array.from({length:32},()=>Math.floor(Math.random()*16).toString(16)).join("");
    localStorage.setItem(key,id);
    return id;
  }catch(e){
    if(!memoryDeviceId)memoryDeviceId=(crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,""):Array.from({length:32},()=>Math.floor(Math.random()*16).toString(16)).join("");
    return memoryDeviceId;
  }
}

function assessPracticeAnswer(answer,lang){
 const a=String(answer||"").trim().toLowerCase();
 const ar=lang==="ar";
 const hasSituation=ar?/(موقف|عميل|كان|حدث|خصم|مشكلة)/.test(a):/(situation|customer|was|because|issue|problem|deduction)/.test(a);
 const hasAction=ar?/(استمعت|راجعت|تحققت|تواصلت|شرحت|قمت|أعدت|عالجت|حللت)/.test(a):/(listened|checked|reviewed|explained|contacted|processed|refunded|resolved|guided|investigated|action)/.test(a);
 const hasResult=ar?/(النتيجة|أصبح|انتهى|سعيد|راضٍ|تم حل|استرداد|نجح)/.test(a):/(result|happy|satisfied|resolved|refund|success|successfully|improved|ended)/.test(a);
 const words=a.split(/\\s+/).filter(Boolean).length;
 const strengths=[],improvements=[];
 if(hasSituation)strengths.push(ar?"وضحت خلفية الموقف وسبب المشكلة.":"You described the context and the customer's issue.");
 if(hasAction)strengths.push(ar?"ذكرت إجراءات عملية اتخذتها لحل المشكلة.":"You mentioned practical actions taken to resolve the issue.");
 if(hasResult)strengths.push(ar?"أشرت إلى نتيجة أو أثر إيجابي.":"You included an outcome or positive impact.");
 if(!hasSituation)improvements.push(ar?"ابدأ بتوضيح الموقف وسبب تواصل العميل.":"Start by explaining the situation and why the customer contacted you.");
 if(!hasAction)improvements.push(ar?"حدد خطواتك بالتفصيل، وما الذي فعلته أنت تحديدًا.":"Describe the exact steps you personally took and why.");
 if(!hasResult)improvements.push(ar?"اختم بالنتيجة: هل حُلّت المشكلة؟ وكيف تأكدت من رضا العميل؟":"Finish with the outcome: was the issue resolved, and how did you confirm customer satisfaction?");
 if(words<45)improvements.push(ar?"أضف تفاصيل أكثر؛ إجابتك قصيرة ولا توضح تسلسل خطواتك بالكامل.":"Add more detail; the answer is brief and does not fully explain the sequence of actions.");
 else if(words>140)improvements.push(ar?"اختصر التفاصيل واحتفظ فقط بما يخدم الموقف والإجراء والنتيجة.":"Trim details that do not support the situation, action, or result.");
 if(!improvements.length)improvements.push(ar?"أضف مقياسًا أو دليلًا يوضح أثر الحل، وما تعلمته من التجربة.":"Make the result more specific with evidence or a metric, and add what you learned.");
 return {strengths,improvements,checks:{situation:hasSituation,action:hasAction,result:hasResult},wordCount:words,kind:"structure_check"};
}
function SP(){const weak=getWeakestSkill(),done=readSmartPractice();if(!weak)return '<div class="card"><h2>'+t("smartPractice")+'</h2><p class="mu">'+t("noPractice")+'</p><button class="btn" data-a="progress">'+t("backHome")+'</button></div>';if(S.smartSkill!==weak.id){S.smartSkill=weak.id;S.smartAnswer="";S.smartSaved=false;}const safeSteps=t("practiceSteps").map(x=>"<li>"+esc(x)+"</li>").join("");return '<div class="card"><div class="row"><h2>'+t("smartPractice")+'</h2><span class="pill">'+done.length+' / 30</span></div><p class="mu">'+t("practiceIntro")+'</p><h3>'+t("weakestSkill")+': '+esc(weak.name)+' ('+weak.score+'/100)</h3><div class="card" style="background:var(--soft)"><b>'+t("practiceQuestion")+'</b><p dir="auto" lang="'+S.ui+'" style="margin-bottom:0">'+esc(t(weak.q))+'</p></div><label for="smartAnswer">'+t("practiceAnswer")+'</label><textarea id="smartAnswer" rows="6" placeholder="'+t("practicePlaceholder")+'" '+(S.smartSaved?"disabled":"")+'>'+esc(S.smartAnswer)+'</textarea><h3>'+t("practiceGuide")+': '+t("practiceStructureName")+'</h3><ol>'+safeSteps+'</ol><p class="mu">'+t("practiceTip")+'</p>'+(S.smartSaved?'<div class="card" style="background:var(--soft)"><h3>'+t("practiceFeedback")+'</h3><p class="mu">'+t("practiceFeedbackNote")+'</p><b>'+t("practiceStrengths")+'</b><ul>'+S.smartFeedback.strengths.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><b>'+t("practiceImprovements")+'</b><ul>'+S.smartFeedback.improvements.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="mu">'+t("practiceChecklist")+': '+(S.smartFeedback.checks.situation?'✓':'—')+' '+t("practiceSituation")+' · '+(S.smartFeedback.checks.action?'✓':'—')+' '+t("practiceAction")+' · '+(S.smartFeedback.checks.result?'✓':'—')+' '+t("practiceResult")+'</p></div><p class="mu">'+t("practiceSaved")+'</p><button class="btn" data-a="smartAgain">'+t("practiceAgain")+'</button>':'<button class="btn" data-a="smartSave" '+(S.smartAnswer.trim().length<10?"disabled":"")+'>'+t("savePractice")+'</button>')+'<button class="lnk" data-a="progress">'+t("backHome")+'</button></div>'}
function MP(){
const h=readProgressHistory().slice().reverse();
if(!h.length)return '<div class="card"><h2>'+t("myProgress")+'</h2><p class="mu">'+t("noHistory")+'</p><button class="btn" data-a="home">'+t("backHome")+'</button></div>';
const avg=Math.round(h.reduce((s,x)=>s+Number(x.overall),0)/h.length),latest=Math.round(Number(h[0].overall));
const ids=["communicationClarity","answerRelevance","problemSolving","answerStructure","roleKnowledge"],names=t("skillNames");
const skills=ids.map((id,i)=>{const v=h.flatMap(x=>x.skills.filter(y=>y.id===id).map(y=>Number(y.score))).filter(Number.isFinite);return{name:names[i],score:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0}});
const fmt=d=>new Date(d).toLocaleDateString(S.ui==="ar"?"ar-EG":"en-GB",{day:"numeric",month:"short",year:"numeric"});
return '<div class="card"><div class="row"><h2>'+t("myProgress")+'</h2><span class="pill">'+h.length+' / 30</span></div><p class="mu">'+t("progressIntro")+'</p><div class="progress-grid"><div class="stat"><strong>'+h.length+'</strong><span>'+t("completed")+'</span></div><div class="stat"><strong>'+avg+'</strong><span>'+t("average")+'</span></div><div class="stat"><strong>'+latest+'</strong><span>'+t("latest")+'</span></div></div><h3 style="margin-top:20px">'+t("skillProgress")+'</h3>'+skills.map(x=>'<div class="d"><div class="row"><b>'+esc(x.name)+'</b><b>'+x.score+'/100</b></div><div class="bar"><i style="width:'+x.score+'%"></i></div></div>').join("")+'</div><div class="card"><h3>'+t("smartPractice")+'</h3><p class="mu">'+t("practiceIntro")+'</p><button class="btn" data-a="smartPractice">'+t("practiceNow")+'</button></div><div class="card"><h3>'+t("history")+'</h3>'+h.map(x=>'<div class="history-item"><div class="row"><b>'+esc(x.role||x.track||"Interview")+'</b><b>'+Math.round(Number(x.overall))+'/100</b></div><div class="row mu"><span>'+fmt(x.date)+'</span><span>'+(x.language==="ar"?"العربية":"English")+'</span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,Number(x.overall)))+'%"></i></div></div>').join("")+'<button class="btn" data-a="home">'+t("backHome")+'</button></div>';
}
function R(){const screenChanged=R.lastScreen!==S.scr;const h=document.documentElement;h.lang=S.ui;h.dir=S.ui=='ar'?'rtl':'ltr';
$('#app').innerHTML=`<header><div data-a="home" style="cursor:pointer"><div class="brand">Interview <b>Gym</b></div><div class="sig">By K.Seoudi</div></div><button class="lnk" data-a="progress" style="margin:0 10px">${t("myProgress")}</button><div class="lang"><button data-a="ui" data-v="en" aria-pressed="${S.ui=='en'}">English</button><button data-a="ui" data-v="ar" aria-pressed="${S.ui=='ar'}">العربية</button></div></header>`+{w:W,s:levelPage,track:trackPage,custom:customPage,i:I,r:Rp,p:MP,sp:SP}[S.scr]()+`<footer class="ft">Created by K.Seoudi</footer>`;if(screenChanged){R.lastScreen=S.scr;window.scrollTo(0,0)}}
const H={ui:v=>{S.ui=v;R()},home:()=>{if(S.busy)return;S.scr='w';R()},go:()=>{S.scr='s';R()},toTrack:()=>{S.scr='track';R()},toLevel:()=>{S.scr='s';R()},toCustom:()=>{S.scr='custom';R()},progress:()=>{S.scr='p';R()},smartPractice:()=>{S.scr='sp';S.smartAnswer='';S.smartSaved=false;S.smartFeedback=null;R()},smartSave:()=>{if(S.smartSaved||S.smartAnswer.trim().length<10)return;const weak=getWeakestSkill();if(!weak)return;const feedback=assessPracticeAnswer(S.smartAnswer,S.ui);const list=readSmartPractice();list.push({date:new Date().toISOString(),skill:weak.id,answer:S.smartAnswer.trim(),feedback});try{localStorage.setItem(PRACTICE_KEY,JSON.stringify(list.slice(-30)));S.smartFeedback=feedback;S.smartSaved=true;R()}catch(e){alert(S.ui==='ar'?'تعذر حفظ التدريب في المتصفح.':'Could not save practice in this browser.')}},smartAgain:()=>{S.smartAnswer='';S.smartSaved=false;S.smartFeedback=null;R()},
lv:v=>{S.lvl=+v;R()},il:v=>{S.il=v==1?'ar':'en';R()},ty:v=>{S.ty=+v;R()},track:v=>{S.track=TRACKS[+v]||TRACKS[0];R()},nq:v=>{S.n=v==1?10:5;R()},ai:()=>{S.ai=!S.ai;R()},
begin:async()=>{const b=document.querySelector('[data-a="begin"]');if(b){b.disabled=true;b.textContent=S.ui==="ar"?"جارٍ تحميل الأسئلة…":"Loading questions…"}try{await loadQuestionBank();build();S.scr='i';R()}catch(e){if(b){b.disabled=false;b.textContent=t('go')}alert(S.ui==="ar"?"تعذر تحميل بنك الأسئلة. تحقق من الاتصال وحاول مرة أخرى.":"Could not load the question bank. Check your connection and try again.");}},sub,
retry:()=>evalAll(),review:()=>{if(S.busy)return;S.scr='i';S.i=Math.max(0,Math.min(S.qs.length-1,S.ans.length-1));S.draft=S.ans[S.i]?S.ans[S.i].text:'';S.err='';R()},
bk:()=>{if(S.i<1||S.busy)return;S.i--;S.fbOn=false;S.err='';S.draft=S.ans[S.i]?S.ans[S.i].text:'';R()},
end:()=>{if(!S.busy&&confirm(S.ui==='ar'?'هل تريد إنهاء المقابلة الآن؟ سيتم الانتقال إلى التقييم.':'End this interview now? You will move to the evaluation.'))fin()},again:()=>{S.scr='s';R()}};
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&H[b.dataset.a]&&!b.disabled)H[b.dataset.a](b.dataset.v)});
$('#app').addEventListener('input',e=>{if(e.target.id=='ans'){S.draft=e.target.value;const c=document.querySelector('#answerCount');if(c){const words=(S.draft.trim().match(/\S+/g)||[]).length;c.textContent=words+' '+(S.ui==='ar'?'كلمة':'words')+' · '+S.draft.length+'/4000 '+(S.ui==='ar'?'حرف':'chars')}if(S.err){S.err='';const p=document.querySelector('.er');if(p)p.remove()}}if(e.target.id=='fu')S.fu=e.target.value;if(e.target.id=='smartAnswer'){S.smartAnswer=e.target.value;const b=document.querySelector('[data-a="smartSave"]');if(b)b.disabled=S.smartAnswer.trim().length<10;}});
R();
</script></body></html>
