const an=E.answers.map((x,i)=>{const sc=Math.round(Number(x&&x.score));if(!isFinite(sc)){console.warn("Interview Gym: invalid score at answers["+i+"]");throw{k:"bad"}}
return{q:a[i].q,text:a[i].text,score:cl(sc),summary:String(x.summary||""),strengths:arr(x.strengths),improvements:arr(x.improvements),sug:x.suggestedAnswer?String(x.suggestedAnswer):""}});
S.ev={ov:cl(ov),summary:String(E.summary||""),strengths:arr(E.strengths),improvements:arr(E.improvements),answers:an}}
catch(e){S.err=errMsg(e.k?e:{k:"net"})}
finally{clearTimeout(tm);S.busy=false;R()}}
function build(){const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),m=q=>q[0].includes(S.lvl),
a=sh(Q.filter(q=>m(q)&&q[1]==S.ty)),b=sh(Q.filter(q=>m(q)&&q[1]!=S.ty)),c=sh(Q.filter(q=>!m(q)));S.qs=[...a,...b,...c].slice(0,S.n);
S.i=0;S.ans=[];S.draft='';S.fbOn=false;S.err='';S.note='';S.rep=null;S.ev=null}
function sub(){const v=S.draft.trim();if(!v){S.err=t('empty');R();return}
S.err='';S.ans[S.i]={q:S.qs[S.i],text:v};
if(S.i+1>=S.qs.length)fin();else{S.i++;S.draft=S.ans[S.i]?S.ans[S.i].text:'';R()}}
function fin(){S.scr='r';S.ev=null;S.err='';if(S.ans.filter(Boolean).length)evalAll();else R()}
const chips=(arr,sel,act)=>`<div class="chips">${arr.map((x,i)=>`<button class="chip" data-a="${act}" data-v="${i}" aria-pressed="${sel==i}">${esc(x)}</button>`).join('')}</div>`;
const W=()=>`<div class="card"><span class="tag">${t('tag')}</span><h1>${t('h')}</h1><p class="mu">${t('d')}</p><button class="btn big" data-a="go">${t('start')}</button></div><div class="card"><h3>${t('how')}</h3><ol class="steps">${t('steps').map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
const Su=()=>`<div class="card"><h3>${t('lvl')}</h3>${chips(t('lvls'),S.lvl,'lv')}<h3>${t('il')}</h3>${chips(['English','العربية'],S.il=='ar'?1:0,'il')}<h3>${t('ty')}</h3>${chips(t('tys'),S.ty,'ty')}<h3>${t('nq')}</h3>${chips(['5'+t('qn'),'10'+t('qn')],S.n==10?1:0,'nq')}
<p class="mu">${t('aiNote')}</p><button class="btn big" data-a="begin">${t('go')}</button><button class="lnk" data-a="home">${t('back')}</button></div>`;
const ulh=x=>x.length?`<ul style="margin:4px 0">${x.map(i=>`<li dir="auto">${esc(i)}</li>`).join('')}</ul>`:'';
const lst=(h,x)=>x.length?`<h3 style="margin:12px 0 4px">${h}</h3>${ulh(x)}`:'';
const I=()=>{const q=S.qs[S.i],n=S.qs.length,p=Math.round(S.i/n*100),last=S.i+1>=n;
return`<div class="card"><div class="row"><span class="mu">${t('q')} ${S.i+1} ${t('of')} ${n}</span><span class="mu">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div><h2 dir="auto" lang="${S.il}">${esc(q[S.il=='ar'?3:2])}</h2>
<textarea id="ans" dir="auto" maxlength="4000" placeholder="${t('ph')}">${esc(S.draft)}</textarea>${S.err?`<p class="er">${S.err}</p>`:''}<button class="btn" data-a="sub">${last?t('sub2'):t('sub')}</button>
<div class="row"><button class="lnk" data-a="bk" ${S.i?'':'disabled'}>${t('back')}</button><button class="lnk" data-a="end">${t('end')}</button></div></div>`};
const Rp=()=>{const a=S.ans.filter(Boolean);
if(!a.length)return`<div class="card"><p>${t('none')}</p><button class="btn" data-a="again">${t('again')}</button></div>`;
if(S.busy)return`<div class="card"><p><span class="spin"></span>${t('evalWait')}</p></div>`;
if(!S.ev)return`<div class="card"><p class="er">${S.err}</p><p class="mu">${t('saved')}</p><p class="mu">${t('retryWarning')}</p><button class="btn" data-a="retry">${t('retry')}</button><button class="lnk" data-a="review">${t('review')}</button></div>`;
const e=S.ev,weak=[...e.answers].sort((x,y)=>x.score-y.score).filter(x=>x.score<65).slice(0,2),
plan=[t('pl')[0]+t('tys')[S.ty],...[...new Set(weak.flatMap(x=>x.improvements).concat(e.improvements))].slice(0,3),t('pl')[2]];
return`<div class="card"><div class="row"><div><div class="mu">${t('ov')}</div><div class="big-n">${e.ov}<span class="mu" style="font-size:18px">/100</span></div></div><span class="pill">${a.length} ${t('q')}</span></div>
<p dir="auto">${esc(e.summary)}</p>${lst(t('sg'),e.strengths)}${lst(t('im'),e.improvements)}<p class="mu">${t('disc')}</p></div>
<h3 style="margin:18px 4px 8px">${t('fb')}</h3>
${e.answers.map((x,i)=>`<div class="card"><div class="row"><span class="mu">${t('q')} ${i+1}</span><b>${x.score}/100</b></div><div class="bar"><i style="width:${x.score}%"></i></div><h3 dir="auto" lang="${S.il}" style="margin:8px 0">${esc(x.q[S.il=='ar'?3:2])}</h3><p class="mu" dir="auto" style="white-space:pre-wrap;margin:0 0 8px">${esc(x.text)}</p><p dir="auto" style="margin:0">${esc(x.summary)}</p>${lst(t('sg'),x.strengths)}${lst(t('im'),x.improvements)}${x.sug?`<h3 style="margin:12px 0 4px">${t('ex')}</h3><p dir="auto" lang="${S.il}" style="margin:0">${esc(x.sug)}</p>`:''}</div>`).join('')}
<div class="card"><h3>${t('plan')}</h3><ol>${plan.map(x=>`<li dir="auto">${esc(x)}</li>`).join('')}</ol><button class="btn" data-a="again">${t('again')}</button></div>`};
function R(){const h=document.documentElement;h.lang=S.ui;h.dir=S.ui=='ar'?'rtl':'ltr';
$('#app').innerHTML=`<header><div data-a="home" style="cursor:pointer"><div class="brand">Interview <b>Gym</b></div><div class="sig">By K.Seoudi</div></div><div class="lang"><button data-a="ui" data-v="en" aria-pressed="${S.ui=='en'}">English</button><button data-a="ui" data-v="ar" aria-pressed="${S.ui=='ar'}">العربية</button></div></header>`+{w:W,s:Su,i:I,r:Rp}[S.scr]()+`<footer class="ft">Created by K.Seoudi</footer>`}
const H={ui:v=>{S.ui=v;if(S.scr=='w'||S.scr=='s')S.il=v;R()},home:()=>{if(S.busy)return;S.scr='w';R()},go:()=>{S.scr='s';R()},
lv:v=>{S.lvl=+v;R()},il:v=>{S.il=v==1?'ar':'en';R()},ty:v=>{S.ty=+v;R()},nq:v=>{S.n=v==1?10:5;R()},ai:()=>{S.ai=!S.ai;R()},
begin:()=>{build();S.scr='i';R()},sub,
retry:()=>evalAll(),review:()=>{if(S.busy)return;S.scr='i';S.i=Math.max(0,Math.min(S.qs.length-1,S.ans.length-1));S.draft=S.ans[S.i]?S.ans[S.i].text:'';S.err='';R()},
bk:()=>{if(S.i<1||S.busy)return;S.i--;S.fbOn=false;S.err='';S.draft=S.ans[S.i]?S.ans[S.i].text:'';R()},
end:()=>{if(!S.busy)fin()},again:()=>{S.scr='s';R()}};
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&H[b.dataset.a]&&!b.disabled)H[b.dataset.a](b.dataset.v)});
$('#app').addEventListener('input',e=>{if(e.target.id=='ans'){S.draft=e.target.value;if(S.err){S.err='';const p=document.querySelector('.er');if(p)p.remove()}}if(e.target.id=='fu')S.fu=e.target.value});
R();
</script></body></html>
