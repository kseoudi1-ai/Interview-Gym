name: Deploy Interview Gym Staging Worker

on:
  push:
    branches:
      - feature/structured-evaluation
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staging-only deployment
        run: |
          test "${GITHUB_REF_NAME}" = "feature/structured-evaluation"
          grep -q '"name": "interview-gym-api-staging"' cloudflare-worker/wrangler.jsonc
          ! grep -q '"name": "interview-gym-api-test"' cloudflare-worker/wrangler.jsonc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare authentication and account access
        working-directory: cloudflare-worker
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify configured Account ID matches token-accessible accounts
        working-directory: cloudflare-worker
        shell: bash
        run: |
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "Configured Account ID format is invalid (expected 32 hexadecimal characters)."
            echo "Configured value length: ${#CLOUDFLARE_ACCOUNT_ID}"
            exit 1
          fi

          response=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")

          if echo "$response" | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.success == true and ([.result[].id] | index($id) != null)' >/dev/null; then
            echo "Account ID matches an account accessible to this API token."
          else
            echo "Account ID does not match any account accessible to this API token."
            echo "No account IDs or token values will be printed."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Test Worker
        working-directory: cloudflare-worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

