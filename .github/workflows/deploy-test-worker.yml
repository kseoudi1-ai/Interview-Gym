name: Deploy Interview Gym Staging Worker

on:
  push:
    branches:
      - feature/structured-evaluation
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staging-only deployment
        run: |
          test "${GITHUB_REF_NAME}" = "feature/structured-evaluation"
          grep -q '"name": "interview-gym-api-staging"' cloudflare-worker/wrangler.jsonc
          ! grep -q '"name": "interview-gym-api-test"' cloudflare-worker/wrangler.jsonc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare authentication
        working-directory: cloudflare-worker
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Discover account that owns the production Worker
        shell: bash
        run: |
          set -euo pipefail

          accounts=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")

          if ! echo "$accounts" | jq -e '.success == true' >/dev/null; then
            echo "Cloudflare API could not list accounts for this token."
            exit 1
          fi

          matched_account=""
          match_count=0

          while IFS= read -r account_id; do
            scripts=$(curl --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts") || continue

            if echo "$scripts" | jq -e '.success == true and any(.result[]?; .id == "interview-gym-api-test")' >/dev/null; then
              matched_account="$account_id"
              match_count=$((match_count + 1))
            fi
          done < <(echo "$accounts" | jq -r '.result[].id')

          if [ "$match_count" -ne 1 ]; then
            echo "Expected to find the production Worker in exactly one token-accessible account; found $match_count."
            echo "Check that the API token has Workers Scripts Read/Edit and account access."
            exit 1
          fi

          if ! [[ "$matched_account" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "Cloudflare returned an unexpected account identifier format."
            exit 1
          fi

          echo "Confirmed account containing the existing production Worker."
          echo "CLOUDFLARE_ACCOUNT_ID=$matched_account" >> "$GITHUB_ENV"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Test Worker
        working-directory: cloudflare-worker
        run: npx wrangler deploy --config wrangler.jsonc --account-id "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
