name: Deploy Interview Gym Staging Worker

on:
  push:
    branches:
      - feature/improvement-progress
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staging-only deployment
        run: |
          test "${GITHUB_REF_NAME}" = "feature/improvement-progress"
          grep -q '"name": "interview-gym-api-staging"' cloudflare-worker/wrangler.jsonc
          ! grep -q '"name": "interview-gym-api-test"' cloudflare-worker/wrangler.jsonc

      - name: Validate frontend JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("index.html","utf8"); const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]; if(!scripts.length) throw new Error("No inline application script found"); scripts.forEach((m,i)=>{new Function(m[1]); console.log("Inline script "+(i+1)+" syntax passed")})'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters."
            exit 1
          fi
          npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Staging Worker
        working-directory: cloudflare-worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test Staging Worker and Durable Object
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/staging-diagnostic.json --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $DIAGNOSTIC_TOKEN" \
            --data '{"mode":"diagnostic","action":"probe","deviceId":"staging-smoke-test-0001"}' \
            "https://interview-gym-api-staging.kseoudi1.workers.dev")
          echo "Staging diagnostic HTTP status: $status"
          cat /tmp/staging-diagnostic.json
          if [[ "$status" != "200" ]] || ! jq -e 'has("allowed") and has("code")' /tmp/staging-diagnostic.json >/dev/null; then
            echo "Staging diagnostic endpoint returned an unexpected response."
            exit 1
          fi
          echo "Staging Worker and Durable Object diagnostic passed."
          jq '{allowed, code}' /tmp/staging-diagnostic.json
        env:
          DIAGNOSTIC_TOKEN: ${{ secrets.DIAGNOSTIC_TOKEN }}
