<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px}.brand b{color:var(--tl)}
.lang{display:flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;color:var(--mu);padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--tl);color:var(--on);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.2;margin:8px 0}h2{font-size:21px;line-height:1.35;margin:14px 0}h3{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:14px}.tag{color:var(--tl);font-weight:600}
.btn{background:var(--tl);color:var(--on);border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn:disabled{opacity:.55;cursor:default}.btn.big{font-size:18px}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;text-decoration:underline}.lnk:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tl2);border-color:var(--tl);color:var(--tl);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--tl);transition:width .5s}
textarea{width:100%;min-height:170px;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--tx);resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--tl);outline-offset:2px}
.er{color:var(--bad);margin:6px 0}.fb{background:var(--tl2);border-radius:12px;padding:14px;margin:10px 0}
.steps{display:grid;gap:8px;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;display:flex;gap:10px;align-items:center}
.steps li:before{content:counter(s);background:var(--tl);color:var(--on);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.big-n{font-size:56px;font-weight:800;color:var(--tl);line-height:1}
.d{margin:10px 0}.d .row{font-size:14px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--tl2);color:var(--tl);font-weight:600}
.ex{border-inline-start:3px solid var(--tl);padding-inline-start:12px;margin:10px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--tl);border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-inline-end:6px}@keyframes r{to{transform:rotate(360deg)}}
.sig{font-size:12px;letter-spacing:.08em;color:var(--mu);margin-top:-2px;font-weight:500}
.ft{text-align:center;color:var(--mu);font-size:13px;padding:20px 0 8px;letter-spacing:.04em}.ft:before{content:"";display:block;width:36px;height:2px;background:var(--tl);margin:0 auto 12px;border-radius:2px}
@media(min-width:700px){#app{padding:32px 16px}h1{font-size:40px}.btn{width:auto}.btn.big{width:100%}}
</style></head>

qt=x=>esc(x.q[S.il=='ar'?3:2]),rec=[...new Set(a.flatMap(x=>x.improvements))].slice(0,4),

return`<div class="card"><div class="row"><div><div class="mu">${t('ov')}</div><div class="big-n">${ov}<span class="mu" style="font-size:18px">/100</span></div></div><span class="pill">${a.length} ${t('q')}</span></div>
<h3 style="margin-top:14px">${t('pq')}</h3>${a.map(x=>`<div class="d"><div class="row"><span dir="auto">${qt(x)}</span><b>${x.score}</b></div><div class="bar"><i style="width:${x.score}%"></i></div></div>`).join('')}<p class="mu">${t('disc')}</p></div>
<div class="card"><h3>${t('st')}</h3>${strong.length?strong.map(x=>`<div class="ex"><div class="mu">${qt(x)} · ${x.score}/100</div><p dir="auto" style="margin:4px 0">${esc(x.text)}</p>${ulh(x.strengths)}</div>`).join(''):'–'}</div>
<div class="card"><h3>${t('im')}</h3>${weak.length?weak.map(x=>`<div class="ex"><div class="mu">${qt(x)} · ${x.score}/100</div>${ulh(x.improvements)}</div>`).join(''):`<p>${t('noWeak')}</p>`}${lst(t('rc'),rec)}</div>
${weak.some(x=>x.sug)?`<div class="card"><h3>${t('ex')}</h3>${weak.filter(x=>x.sug).map(x=>`<div class="ex"><div class="mu">${qt(x)}</div><p dir="auto" lang="${S.il}" style="margin:4px 0">${esc(x.sug)}</p></div>`).join('')}</div>`:''}
<div class="card"><h3>${t('plan')}</h3><ol>${plan.map(x=>`<li dir="auto">${esc(x)}</li>`).join('')}</ol><button class="btn" data-a="again">${t('again')}</button></div>`};
function R(){const h=document.documentElement;h.lang=S.ui;h.dir=S.ui=='ar'?'rtl':'ltr';
$('#app').innerHTML=`<header><div data-a="home" style="cursor:pointer"><div class="brand">Interview <b>Gym</b></div><div class="sig">By K.Seoudi</div></div><div class="lang"><button data-a="ui" data-v="en" aria-pressed="${S.ui=='en'}">English</button><button data-a="ui" data-v="ar" aria-pressed="${S.ui=='ar'}">العربية</button></div></header>`+{w:W,s:Su,i:I,r:Rp}[S.scr]()+`<footer class="ft">Created by K.Seoudi</footer>`}
const H={ui:v=>{S.ui=v;if(S.scr=='w'||S.scr=='s')S.il=v;R()},home:()=>{if(S.busy)return;S.scr='w';R()},go:()=>{S.scr='s';R()},
lv:v=>{S.lvl=+v;R()},il:v=>{S.il=v==1?'ar':'en';R()},ty:v=>{S.ty=+v;R()},nq:v=>{S.n=v==1?10:5;R()},ai:()=>{S.ai=!S.ai;R()},
begin:()=>{build();S.scr='i';R()},sub,
next:()=>{S.fbOn=false;S.note='';if(S.i+1>=S.qs.length)fin();else{S.i++;S.draft=S.ans[S.i]?S.ans[S.i].text:'';R()}},
bk:()=>{if(S.i<1||S.busy)return;S.i--;S.fbOn=false;S.err='';S.draft=S.ans[S.i]?S.ans[S.i].text:'';R()},
end:()=>{if(!S.busy)fin()},again:()=>{S.scr='s';R()}};
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&H[b.dataset.a]&&!b.disabled)H[b.dataset.a](b.dataset.v)});
$('#app').addEventListener('input',e=>{if(e.target.id=='ans'){S.draft=e.target.value;if(S.err){S.err='';const p=document.querySelector('.er');if(p)p.remove()}}if(e.target.id=='fu')S.fu=e.target.value});
R();
</script></body></html>
